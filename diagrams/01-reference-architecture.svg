<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="at ad"><title id="at">SDV architecture study map</title><desc id="ad">Six architectural layers plus lifecycle, identity, observability, diagnostics and updates across the layers.</desc><rect width="900" height="600" rx="18" fill="#0c1526"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e8eef9}.label{font-size:17px;font-weight:700}.sub{font-size:15px;fill:#b9c8e0}</style><text x="30" y="36" class="label">SDV — ARCHITECTURE STUDY MAP</text><rect x="28" y="58" width="650" height="66" rx="10" fill="#164e63" stroke="#6783ae"/><text x="48" y="84" class="label">CLOUD / FLEET</text><text x="48" y="107" class="sub">Telemetry, digital twin, release decisions</text><path d="M350 124 v14" stroke="#81c9e8" stroke-width="3"/><rect x="28" y="138" width="650" height="66" rx="10" fill="#1e3a5f" stroke="#6783ae"/><text x="48" y="164" class="label">VEHICLE APPLICATIONS</text><text x="48" y="187" class="sub">Advisory, HMI, domain-specific logic</text><path d="M350 204 v14" stroke="#81c9e8" stroke-width="3"/><rect x="28" y="218" width="650" height="66" rx="10" fill="#293c67" stroke="#6783ae"/><text x="48" y="244" class="label">DATA / SERVICE ABSTRACTION</text><text x="48" y="267" class="sub">VSS + KUKSA; services via explicit APIs</text><path d="M350 284 v14" stroke="#81c9e8" stroke-width="3"/><rect x="28" y="298" width="650" height="66" rx="10" fill="#35365e" stroke="#6783ae"/><text x="48" y="324" class="label">MIDDLEWARE / VEHICLE I-O</text><text x="48" y="347" class="sub">gRPC, SOME-IP, IPC; CAN providers</text><path d="M350 364 v14" stroke="#81c9e8" stroke-width="3"/><rect x="28" y="378" width="650" height="66" rx="10" fill="#3b3153" stroke="#6783ae"/><text x="48" y="404" class="label">EXECUTION / OS</text><text x="48" y="427" class="sub">Linux or RTOS; process, container, VM</text><path d="M350 444 v14" stroke="#81c9e8" stroke-width="3"/><rect x="28" y="458" width="650" height="66" rx="10" fill="#3b3445" stroke="#6783ae"/><text x="48" y="484" class="label">HARDWARE</text><text x="48" y="507" class="sub">HPC, zones, MCUs, sensors, actuators</text><rect x="704" y="58" width="168" height="466" rx="10" fill="#173c38" stroke="#63c5ac"/><text x="720" y="98" class="label">LIFECYCLE</text><text x="720" y="151" class="sub">Identity / ACL</text><text x="720" y="204" class="sub">Logging</text><text x="720" y="257" class="sub">Metrics / health</text><text x="720" y="310" class="sub">Diagnostics</text><text x="720" y="363" class="sub">Updates</text><text x="720" y="416" class="sub">Resource limits</text><text x="30" y="565" class="sub">Teaching architecture. Components and boundaries must be selected for each project.</text></svg>